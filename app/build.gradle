plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ouri.localai'
    compileSdk 34

    defaultConfig {
        applicationId "com.ouri.localai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            crunchPngs false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packagingOptions {
        resources.excludes += ['META-INF/**', 'DebugProbesKt.bin']
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
}
